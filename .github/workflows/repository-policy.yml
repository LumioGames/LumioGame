name: Repository Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  readme:
    name: README policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate LumioAgent specification
        run: |
          node .spec/tools/spec-lint.mjs
          node --test .spec/tools/spec-lint.test.mjs
      - name: Validate repository boundary documentation
        run: |
          test -s README.md
          test -s LICENSE
          test -s .gitattributes
          grep -q '^\*\.md text eol=lf$' .gitattributes
          grep -q '^## 职责$' README.md
          grep -q '^## 明确不负责什么$' README.md
          grep -q '^## Source / Compile-Time Dependencies$' README.md
          grep -q '^## Headless Test Surface$' README.md
          grep -q '^## 子模块' README.md
          grep -q '^## 当前阶段与开发节奏$' README.md

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LumioGame
        uses: actions/checkout@v4
        with:
          path: game
      - name: Checkout LumioGameRuntime (main)
        uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioGameRuntime
          ref: main
          path: runtime
          token: ${{ secrets.LUMIO_CI_PAT }}
          persist-credentials: false
      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: game/global.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: dotnet build
        working-directory: game
        env:
          LUMIO_RUNTIME_ROOT: ${{ github.workspace }}/runtime
        run: dotnet build LumioGame.sln
      - name: dotnet test
        working-directory: game
        env:
          LUMIO_RUNTIME_ROOT: ${{ github.workspace }}/runtime
        run: dotnet test LumioGame.sln
