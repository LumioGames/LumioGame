name: Repository Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  readme:
    name: README policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate LumioAgent specification
        run: |
          node .spec/tools/lint-extensions.mjs
          node --test .spec/tools/lint-extensions.test.mjs
      - name: Validate repository boundary documentation
        run: |
          test -s README.md
          test -s LICENSE
          test -s .gitattributes
          grep -q '^\*\.md text eol=lf$' .gitattributes
          grep -q '^## 职责$' README.md
          grep -q '^## 明确不负责什么$' README.md
          grep -q '^## Source / Compile-Time Dependencies$' README.md
          grep -q '^## Headless Test Surface$' README.md
          grep -q '^## 子模块' README.md
          grep -q '^## 当前阶段与开发节奏$' README.md

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LumioGame
        uses: actions/checkout@v4
        with:
          path: game
      - name: Checkout LumioGameRuntime (main)
        uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioGameRuntime
          ref: main
          path: runtime
          token: ${{ secrets.LUMIO_CI_PAT }}
          persist-credentials: false
      - name: Checkout LumioGameEngine (main)
        uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioGameEngine
          ref: main
          # Runtime Ecs/Simulation net10.0 只探测同级目录名 LumioGameEngine（或 -p:LumioArchRoot）。
          path: LumioGameEngine
          token: ${{ secrets.LUMIO_CI_PAT }}
          persist-credentials: false
      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: game/global.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: clone-all tests
        working-directory: game
        run: node --test clone-all.test.mjs
      - name: dotnet build
        id: build
        working-directory: game
        env:
          LUMIO_RUNTIME_ROOT: ${{ github.workspace }}/runtime
          LUMIO_ENGINE_ROOT: ${{ github.workspace }}/LumioGameEngine
          LumioArchRoot: ${{ github.workspace }}/LumioGameEngine
        run: dotnet build LumioGame.sln
      # 公开仓 CI 造不出 liblumio_engine_native（ADR-080；Owner 2026-09-23 不扩大 LUMIO_CI_PAT），
      # 需要它的用例带 [RequiresEngineNative]，这里按 trait 排除；其余用例真跑，跳过即失败。
      # 被排除的集合由下一步对账架构仓登记册（ADR-114），解除卡 R-00712 删掉过滤与守卫。
      - name: dotnet test (excluding ADR-114 registered native exemptions)
        working-directory: game
        env:
          LUMIO_RUNTIME_ROOT: ${{ github.workspace }}/runtime
          LUMIO_ENGINE_ROOT: ${{ github.workspace }}/LumioGameEngine
          LumioArchRoot: ${{ github.workspace }}/LumioGameEngine
        run: dotnet test LumioGame.sln --filter-not-trait "RequiresEngineNative=true" --fail-skips on
      # 打印 CI 排除的用例清单与数量（「N 未执行，其中 M 条已登记豁免」），并要求它与架构仓
      # development-verification.md 登记册的 LumioGame 行逐条相等；本地同一条命令即可复现。
      - name: Native exemption report and register guard (ADR-114)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: game
        env:
          LUMIO_RUNTIME_ROOT: ${{ github.workspace }}/runtime
          LUMIO_ENGINE_ROOT: ${{ github.workspace }}/LumioGameEngine
          LumioArchRoot: ${{ github.workspace }}/LumioGameEngine
        run: node eng/native-exemption-guard.mjs
