<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumio · 我的云消息</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.mjs"></script></head>
<body data-mode="connecting">
<main class="chat-shell">
  <header class="chat-header">
    <span class="spirit animated header-spirit" aria-hidden="true"></span>
    <div class="heading"><h1>我的云消息</h1><div class="connection"><i aria-hidden="true"></i><span id="mode">正在连接</span></div></div>
    <span id="identity-avatar"></span><span id="player">匿名玩家</span>
  </header>
  <nav class="tabs" role="tablist" aria-label="消息与发言榜">
    <button id="messages-tab" role="tab" aria-selected="true" aria-controls="messages-panel">我的云消息</button>
    <button id="ranks" role="tab" aria-selected="false" aria-controls="leaderboard-panel" disabled>发言榜 <span aria-hidden="true">♧</span></button>
    <span class="total">已发 <b id="count">—</b> 条</span>
  </nav>
  <div class="content">
    <section id="messages-panel" class="messages-panel" role="tabpanel" aria-labelledby="messages-tab">
      <ol id="msgs" aria-label="我的已确认消息"><li class="empty-state"><span class="spirit animated" aria-hidden="true"></span><strong>留一句话，让灵光相伴</strong><span>连接后即可开始保存我的云消息。</span></li></ol>
    </section>
    <section id="leaderboard-panel" class="leaderboard-panel" role="tabpanel" aria-labelledby="ranks" hidden>
      <div class="rank-heading"><h2>发言排行榜</h2><span>服务器确认 · 全服累计</span></div>
      <ol id="rows"><li class="rank-empty">打开榜单，读取服务器确认的发言数。</li></ol>
    </section>
  </div>
  <div class="status-line" role="status" aria-live="polite"><span id="message">等待平台建立正式游戏连接…</span><button id="recover" hidden disabled>查询原操作</button></div>
  <section class="composer" aria-label="发送消息">
    <button id="begin" class="begin" hidden disabled>进入我的云消息</button>
    <div id="emoji-panel" class="popover emoji-panel" hidden><div class="popover-heading">薄荷精灵表情 <span>随消息发送</span></div><div id="stickers"></div></div>
    <nav id="services" class="popover services" aria-label="游戏服务" hidden>
      <button id="login" disabled>登录 / 绑定存档</button><button id="permissions" disabled>资料授权</button><button id="trial" disabled>离线试玩</button><button id="reconnect" disabled>重读正式进度</button>
      <p>授权由平台处理；拒绝后仍可匿名保存云消息。离线试玩只保留在本页，不计入发言榜。</p>
    </nav>
    <div class="input-row">
      <button id="emoji" class="icon-button" aria-label="精灵表情" aria-controls="emoji-panel" aria-expanded="false" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8 14c2 3 6 3 8 0"/><path d="M8 9h.01M16 9h.01" stroke-linecap="round" stroke-width="3"/></svg></button>
      <label for="box" class="sr-only">消息内容（1–200 个字符）</label><input id="box" maxlength="200" autocomplete="off" placeholder="留一句话，分享一点灵光…" disabled>
      <button id="send" aria-label="发送消息" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m4 4 17 8-17 8 3-8-3-8Z" stroke-linejoin="round"/><path d="M7 12h14"/></svg></button>
    </div>
    <footer><span>仅自己可见 · 云端保留最近 20 条</span><button id="more" aria-label="更多游戏服务" aria-controls="services" aria-expanded="false">更多 ···</button></footer>
  </section>
</main>
</body></html>
