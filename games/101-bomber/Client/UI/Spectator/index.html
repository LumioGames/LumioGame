<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>帽王乱斗 · Lumio Bomber</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./spectator.css">
  <link rel="stylesheet" href="./presentation/presentation.css">
  <!--
    .NET 10 fingerprints the wasm runtime files: `_framework/` holds
    `dotnet.<fingerprint>.js`, never a plain `dotnet.js`. The unfingerprinted
    name exists only as a route in the StaticWebAssets endpoint manifest, which
    a plain static file server does not read — so `main.js`'s
    `import("./_framework/dotnet.js")` can only resolve through an import map.
    These two elements are the SDK's markers: `OverrideHtmlAssetPlaceholders`
    rewrites the preload link and fills the empty import map at build/publish
    with `"./_framework/dotnet.js" -> "./_framework/dotnet.<fingerprint>.js"`.
    Leave them empty here; the published copy carries the real values.
  -->
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
</head>
<body>
  <div id="presentation" hidden>
    <div id="game-stage"></div>
    <div id="game-labels"></div>
    <div id="game-hud"></div>
  </div>
  <h1>帽王乱斗 · Lumio Bomber</h1>
  <section id="room" hidden aria-labelledby="room-title">
    <header class="room-header"><div><p class="room-eyebrow">八人房间 · 19×19</p><h2 id="room-title">帽王乱斗</h2></div><strong id="room-count">— / 8</strong></header>
    <p id="room-status" role="status" aria-live="polite">正在连接房间…</p>
    <ol id="room-seats" aria-label="房间席位"></ol>
    <div class="room-selection"><label for="room-character">角色</label><select id="room-character" disabled><option value="">选择角色</option></select><span id="room-selection-status">请选择角色</span></div>
    <div class="room-actions"><button id="room-fill" type="button" disabled>机器人补齐</button><button id="room-wait" type="button" disabled>等待真人</button></div>
    <p class="room-help">默认等待真人；开启补齐后，每 3 秒加入一位机器人，满 8 人自动开局。</p>
  </section>
  <details id="stage-note" hidden><summary>阶段说明</summary><p>阶段入口：Legacy8 · 19×19（12/16 人、成长/战斗角色/缩圈/结算与同房下一局未验收；19 图中央补给关闭）</p></details>
  <p id="status">starting</p>
  <button id="enter" type="button">Enter game</button>
  <div id="player-info" hidden><span id="player-state"></span><span id="player-self"></span></div>
  <canvas id="field" width="640" height="480"></canvas>
  <div id="player-controls" hidden>
    <div class="direction-pad">
      <button type="button" data-direction="1" aria-label="Move up" title="Move up" disabled>&#8593;</button>
      <button type="button" data-direction="4" aria-label="Move left" title="Move left" disabled>&#8592;</button>
      <button type="button" data-direction="3" aria-label="Move down" title="Move down" disabled>&#8595;</button>
      <button type="button" data-direction="2" aria-label="Move right" title="Move right" disabled>&#8594;</button>
    </div>
    <button type="button" data-bomb disabled>Place bomb</button>
    <button type="button" data-skill title="Use active skill" disabled>Skill</button>
  </div>
  <!-- Block id -> swatch, built at runtime from the ids actually on screen. -->
  <div id="legend"></div>
  <!-- ?view=blocks: the same voxel world drawn by the engine's WebGL2 block renderer (ADR-124). -->
  <canvas id="blocks"></canvas>
  <div id="blocks-hud"></div>
  <div id="blocks-cams"></div>
  <script src="./lumio.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
